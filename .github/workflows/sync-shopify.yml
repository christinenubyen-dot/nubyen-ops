name: Sync Shopify data

on:
  schedule:
    - cron: "0 * * * *" # top of every hour (UTC)
  workflow_dispatch: # manual run from the Actions tab

# Only needs to commit data.json + history.json.
# Cloudflare Pages watches the repo and auto-deploys on each commit,
# so there is no build/deploy step here anymore.
permissions:
  contents: write

concurrency:
  group: "shopify-sync"
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch Shopify data
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/fetch-shopify.mjs

      - name: Commit updated data
        run: |
          git config user.name "shopify-sync-bot"
          git config user.email "actions@github.com"
          git add public/data.json public/history.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: hourly Shopify data sync"
            # Integrate any commits pushed since checkout, then push.
            # Retry a few times in case the repo moves again mid-push.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed; retrying after pull --rebase..."
              sleep 5
            done
          fi
